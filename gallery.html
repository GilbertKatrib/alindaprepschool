<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>School Gallery | Alinda Preparatory School</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .gallery-container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
        }

        .upload-box {
            background: #f5f8f2;
            border: 2px dashed #287443;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .upload-box input,
        .upload-box textarea {
            display: block;
            width: 100%;
            margin: 12px 0;
            padding: 12px;
            box-sizing: border-box;
        }

        .upload-box button {
            background: #287443;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 6px;
            cursor: pointer;
        }

        .upload-box button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 20px;
        }

        .photo-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px #0002;
        }

        .photo-card img {
            width: 100%;
            height: 210px;
            object-fit: cover;
        }

        .photo-info {
            padding: 12px;
        }

        .upload-status {
            font-weight: bold;
            margin-top: 12px;
        }

        .hidden {
            display: none;
        }

    </style>

</head>

<body>

<header>
    <h1>Alinda Preparatory School – Kanara</h1>
    <p>School Gallery</p>
</header>


<main class="gallery-container">

    <h2>Our School Memories</h2>


    <!-- Only authorised staff can see this upload form. -->
    <section id="uploadSection" class="upload-box hidden">

        <h3>Upload School Photos</h3>

        <form id="uploadForm">

            <label for="photoTitle">Photo title:</label>

            <input
                type="text"
                id="photoTitle"
                placeholder="Example: Sports Day 2026"
                maxlength="100"
                required
            >

            <label for="photoDescription">Description:</label>

            <textarea
                id="photoDescription"
                placeholder="Write a short description..."
                maxlength="500"
                rows="3"
            ></textarea>

            <label for="photoFile">Select photos:</label>

            <input
                type="file"
                id="photoFile"
                accept="image/jpeg,image/png,image/webp"
                multiple
                required
            >

            <p>
                Allowed formats: JPG, PNG and WEBP.
                Maximum size: 5 MB per photo.
            </p>

            <button type="submit" id="uploadButton">
                Upload Photos
            </button>

            <p id="uploadStatus" class="upload-status" aria-live="polite"></p>

        </form>

    </section>


    <!-- Uploaded photos appear here. -->
    <section>

        <h2>Photo Collection</h2>

        <div id="galleryGrid" class="gallery-grid">
            <p>Loading photos...</p>
        </div>

    </section>

</main>


<footer>

    <p>Alinda Preparatory School – Kanara</p>
    <p>Education for a Bright Future</p>

</footer>


<script type="module">

    // ==========================================
    // FIREBASE IMPORTS
    // ==========================================

    import { auth, db } from "./firebase-config.js";

    import {
        collection,
        addDoc,
        getDocs,
        query,
        where,
        orderBy,
        doc,
        getDoc,
        serverTimestamp
    } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

    import {
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";


    // ==========================================
    // CLOUDINARY SETTINGS
    // ==========================================

    // Replace these with your real Cloudinary details.

    const CLOUDINARY_CLOUD_NAME = "oorgbbjm";

    const CLOUDINARY_UPLOAD_PRESET = "alinda_school_gallery";


    // ==========================================
    // HTML ELEMENTS
    // ==========================================

    const uploadSection =
        document.getElementById("uploadSection");

    const uploadForm =
        document.getElementById("uploadForm");

    const uploadButton =
        document.getElementById("uploadButton");

    const uploadStatus =
        document.getElementById("uploadStatus");

    const galleryGrid =
        document.getElementById("galleryGrid");


    let currentUser = null;

    let currentUserName = "School Staff";


    // ==========================================
    // CHECK USER PERMISSIONS
    // ==========================================

    onAuthStateChanged(auth, async (user) => {

        currentUser = user;

        uploadSection.classList.add("hidden");

        if (!user) {

            await loadGallery();

            return;

        }

        try {

            const userDocument = await getDoc(
                doc(db, "users", user.uid)
            );

            if (userDocument.exists()) {

                const userData = userDocument.data();

                currentUserName =
                    userData.fullName || "School Staff";

                const allowedRoles = [
                    "headteacher",
                    "director",
                    "staff"
                ];

                if (allowedRoles.includes(userData.role)) {

                    uploadSection.classList.remove("hidden");

                }

            }

        } catch (error) {

            console.error("Account check failed:", error);

        }

        await loadGallery();

    });


    // ==========================================
    // UPLOAD PHOTO TO CLOUDINARY
    // ==========================================

    async function uploadToCloudinary(file) {

        const uploadUrl =
            `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`;

        const formData = new FormData();

        formData.append("file", file);

        formData.append(
            "upload_preset",
            CLOUDINARY_UPLOAD_PRESET
        );

        const response = await fetch(uploadUrl, {

            method: "POST",

            body: formData

        });

        const result = await response.json();

        if (!response.ok) {

            throw new Error(
                result.error?.message || "Cloudinary upload failed."
            );

        }

        return result.secure_url;

    }


    // ==========================================
    // HANDLE PHOTO UPLOAD FORM
    // ==========================================

    uploadForm.addEventListener("submit", async (event) => {

        event.preventDefault();

        if (!currentUser) {

            uploadStatus.textContent =
                "Please sign in first.";

            return;

        }

        if (
            CLOUDINARY_CLOUD_NAME === "YOUR_CLOUD_NAME" ||
            CLOUDINARY_UPLOAD_PRESET === "YOUR_UPLOAD_PRESET"
        ) {

            uploadStatus.textContent =
                "Please configure your Cloudinary settings first.";

            return;

        }

        const title =
            document.getElementById("photoTitle").value.trim();

        const description =
            document.getElementById("photoDescription").value.trim();

        const files =
            document.getElementById("photoFile").files;


        if (!title || files.length === 0) {

            uploadStatus.textContent =
                "Enter a title and select photos.";

            return;

        }

        if (files.length > 10) {

            uploadStatus.textContent =
                "You can upload a maximum of 10 photos at once.";

            return;

        }

        uploadButton.disabled = true;

        let successfulUploads = 0;


        try {

            for (const file of files) {

                // Check the image format.
                const allowedTypes = [
                    "image/jpeg",
                    "image/png",
                    "image/webp"
                ];

                if (!allowedTypes.includes(file.type)) {

                    throw new Error(
                        file.name + " has an unsupported format."
                    );

                }


                // Check the image size.
                if (file.size > 5 * 1024 * 1024) {

                    throw new Error(
                        file.name + " is larger than 5 MB."
                    );

                }


                // Upload image to Cloudinary.
                const imageUrl =
                    await uploadToCloudinary(file);


                // Save image information in Firebase Firestore.
                await addDoc(
                    collection(db, "school_gallery"),
                    {

                        title: title,

                        description: description,

                        imageUrl: imageUrl,

                        published: true,

                        postedBy: currentUserName,

                        uploadedBy: currentUser.uid,

                        createdAt: serverTimestamp()

                    }
                );


                successfulUploads++;

                uploadStatus.textContent =
                    successfulUploads +
                    " of " +
                    files.length +
                    " photos uploaded successfully.";

            }


            uploadStatus.textContent =
                "All photos uploaded successfully!";

            uploadForm.reset();

            await loadGallery();


        } catch (error) {

            console.error("Upload error:", error);

            uploadStatus.textContent =
                "Upload failed: " + error.message;

        } finally {

            uploadButton.disabled = false;

        }

    });


    // ==========================================
    // DISPLAY PHOTOS FROM FIRESTORE
    // ==========================================

    async function loadGallery() {

        try {

            const galleryQuery = query(

                collection(db, "school_gallery"),

                where("published", "==", true),

                orderBy("createdAt", "desc")

            );


            const snapshot = await getDocs(galleryQuery);

            galleryGrid.replaceChildren();


            if (snapshot.empty) {

                const message = document.createElement("p");

                message.textContent =
                    "No photos have been uploaded yet.";

                galleryGrid.appendChild(message);

                return;

            }


            snapshot.forEach((documentSnapshot) => {

                const photo = documentSnapshot.data();

                const card = document.createElement("article");

                card.className = "photo-card";


                const image = document.createElement("img");

                image.src = photo.imageUrl;

                image.alt = photo.title || "School photograph";

                image.loading = "lazy";


                const information = document.createElement("div");

                information.className = "photo-info";


                const heading = document.createElement("h3");

                heading.textContent =
                    photo.title || "School Photo";


                const description = document.createElement("p");

                description.textContent =
                    photo.description || "";


                const postedBy = document.createElement("small");

                postedBy.textContent =
                    "Uploaded by: " +
                    (photo.postedBy || "School Staff");


                information.append(
                    heading,
                    description,
                    postedBy
                );

                card.append(image, information);

                galleryGrid.appendChild(card);

            });


        } catch (error) {

            console.error("Gallery loading error:", error);

            galleryGrid.textContent =
                "Unable to load photos. Check Firebase permissions.";

        }

    }

</script>

</body>
</html>
