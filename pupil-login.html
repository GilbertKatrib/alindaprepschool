<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pupil Portal & Admissions | Kawa Academy</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <div class="badge-watermark" aria-hidden="true"></div>

    <header class="navbar">
        <div class="container nav-flex">
            <a href="index.html" class="brand">
                <img src="badge.png" alt="Kawa Academy Badge" class="nav-badge">
                <div>
                    <h1>Kawa Academy</h1>
                    <span>Primary School Portal</span>
                </div>
            </a>
            <nav>
                <a href="index.html">Home</a>
                <a href="staff-login.html">Staff Portal</a>
                <a href="dos-login.html">DOS</a>
            </nav>
        </div>
    </header>

    <main class="container portal-grid">
        <section class="card">
            <h2>Pupil Login</h2>
            <p class="subtitle">Access your class timetable, homework, and term reports.</p>
            <form id="pupilLoginForm">
                <div class="form-group">
                    <label for="pupilId">Pupil Admission Number</label>
                    <input type="text" id="pupilId" placeholder="e.g. KA-2026-001" required>
                </div>
                <div class="form-group">
                    <label for="pupilPass">Password</label>
                    <input type="password" id="pupilPass" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn-primary full-width">Login to Pupil Dashboard</button>
            </form>
        </section>

        <section class="card highlight-card">
            <h2>Apply for a Child's Vacancy</h2>
            <p class="subtitle">Parents & guardians: Apply online for Nursery to Primary Seven (P.1 – P.7).</p>
            <form id="childAdmissionForm">
                <div class="form-group">
                    <label for="childName">Child's Full Name</label>
                    <input type="text" id="childName" placeholder="Enter child's full name" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="childClass">Class Applying For</label>
                        <select id="childClass" required>
                            <option value="">-- Select Class --</option>
                            <option value="Baby Class">Baby Class</option>
                            <option value="Middle Class">Middle Class</option>
                            <option value="Top Class">Top Class</option>
                            <option value="P.1">Primary One (P.1)</option>
                            <option value="P.2">Primary Two (P.2)</option>
                            <option value="P.3">Primary Three (P.3)</option>
                            <option value="P.4">Primary Four (P.4)</option>
                            <option value="P.5">Primary Five (P.5)</option>
                            <option value="P.6">Primary Six (P.6)</option>
                            <option value="P.7">Primary Seven (P.7)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="childAge">Child's Age</label>
                        <input type="number" id="childAge" min="3" max="15" placeholder="Years" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="parentName">Parent / Guardian Name</label>
                    <input type="text" id="parentName" placeholder="Your full name" required>
                </div>
                <div class="form-group">
                    <label for="parentPhone">Phone Contact</label>
                    <input type="tel" id="parentPhone" placeholder="e.g. 0770 000 000" required>
                </div>
                <button type="submit" class="btn-secondary full-width">Submit Vacancy Application</button>
            </form>
            <div id="admissionFeedback" class="feedback-msg"></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
