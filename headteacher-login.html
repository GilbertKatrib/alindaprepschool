<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Head Teacher Office | Kawa Academy</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <div class="badge-watermark" aria-hidden="true"></div>

    <header class="navbar">
        <div class="container nav-flex">
            <a href="index.html" class="brand">
                <img src="badge.png" alt="Kawa Academy Badge" class="nav-badge">
                <div>
                    <h1>Kawa Academy</h1>
                    <span>Office of the Head Teacher</span>
                </div>
            </a>
            <nav>
                <a href="index.html">Home</a>
                <a href="staff-login.html">Staff Portal</a>
                <a href="directors-login.html">Directors</a>
            </nav>
        </div>
    </header>

    <main class="container single-center">
        <section class="card auth-box">
            <span class="role-badge">Single Administrator Access</span>
            <h2>Head Teacher Sign In</h2>
            <p class="subtitle">Restricted to the Head Teacher of Kawa Academy for academic oversight, timetable approval, and pupil admissions review.</p>
            
            <form id="htrLoginForm">
                <div class="form-group">
                    <label for="htrUsername">Head Teacher ID</label>
                    <input type="text" id="htrUsername" placeholder="HTR-KAWA-01" required>
                </div>
                <div class="form-group">
                    <label for="htrPassword">Security Password</label>
                    <input type="password" id="htrPassword" placeholder="Enter confidential password" required>
                </div>
                <button type="submit" class="btn-primary full-width">Access Head Teacher Dashboard</button>
            </form>
            <div id="htrFeedback" class="feedback-msg"></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
